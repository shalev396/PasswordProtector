$kind: http-request
url: '{{baseUrl}}/private/passwords/{{passwordId}}'
method: GET
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response has full password data', function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property('id');
          pm.expect(json.data).to.have.property('title');
          pm.expect(json.data).to.have.property('password');
          pm.expect(json.data).to.have.property('userId');
      });

      pm.test('Password ID matches requested ID', function () {
          const json = pm.response.json();
          const passwordId = pm.collectionVariables.get('passwordId') || pm.environment.get('passwordId');
          pm.expect(json.data.id).to.equal(passwordId);
      });
    language: text/javascript
order: 1000
