$kind: http-request
url: '{{baseUrl}}/private/passwords/{{passwordId}}'
method: PUT
headers:
  Content-Type: application/json
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
body:
  type: text
  content: '{}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400', function () {
          pm.response.to.have.status(400);
      });

      pm.test('Response indicates no changes', function () {
          const json = pm.response.json();
          pm.expect(json.message).to.be.a('string');
      });
    language: text/javascript
order: 4000
