$kind: http-request
url: '{{baseUrl}}/private/passwords/{{passwordId}}'
method: PUT
headers:
  Content-Type: application/json
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
body:
  type: text
  content: '{"notes":"Updated note"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Notes were updated', function () {
          const json = pm.response.json();
          pm.expect(json.data.notes).to.equal('Updated note');
      });

      pm.test('Other fields preserved', function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property('title');
          pm.expect(json.data).to.have.property('password');
      });
    language: text/javascript
order: 2000
