$kind: http-request
url: '{{baseUrl}}/private/passwords/{{passwordId}}'
method: PUT
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: 'invalid-token-here'
body:
  type: text
  content: '{"title":"Should Fail"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Response indicates failure', function () {
          const json = pm.response.json();
          pm.expect(json.message).to.be.a('string');
      });
    language: text/javascript
order: 6000
