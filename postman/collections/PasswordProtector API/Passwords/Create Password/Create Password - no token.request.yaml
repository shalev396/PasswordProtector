$kind: http-request
url: '{{baseUrl}}/private/passwords'
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: text
  content: '{"title":"Test","password":"test"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Response indicates failure', function () {
          const json = pm.response.json();
          pm.expect(json.message).to.be.a('string');
      });
    language: text/javascript
order: 4000
