$kind: http-request
url: '{{baseUrl}}/private/passwords'
method: POST
headers:
  Content-Type: application/json
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
body:
  type: text
  content: '{"title":"Test Password","username":"testuser","password":"encrypted-test-value","website":"https://example.com","notes":"Test note","category":"General","tags":["test"]}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response has password data', function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property('id');
          pm.expect(json.data).to.have.property('title');
          pm.expect(json.data).to.have.property('password');
          pm.expect(json.data).to.have.property('userId');
          pm.expect(json.data.title).to.equal('Test Password');
      });

      pm.test('Save passwordId for subsequent tests', function () {
          const json = pm.response.json();
          pm.collectionVariables.set('passwordId', json.data.id);
          pm.environment.set('passwordId', json.data.id);
          console.log('passwordId saved: ' + json.data.id);
      });
    language: text/javascript
order: 1000
