$kind: http-request
url: '{{baseUrl}}/private/passwords/{{passwordId}}'
method: DELETE
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response confirms deletion', function () {
          const json = pm.response.json();
          pm.expect(json.data.message).to.equal('Password deleted successfully');
      });
    language: text/javascript
order: 1000
