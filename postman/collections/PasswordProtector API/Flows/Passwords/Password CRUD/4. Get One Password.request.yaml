$kind: http-request
url: '{{baseUrl}}/private/passwords/{{passwordId}}'
method: GET
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Single fetch includes password field', function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property('password');
          pm.expect(json.data).to.have.property('title');
          pm.expect(json.data.title).to.equal('Flow Test Password');
      });
    language: text/javascript
order: 4000
