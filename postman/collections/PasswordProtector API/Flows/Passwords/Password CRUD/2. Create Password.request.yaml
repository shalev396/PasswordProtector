$kind: http-request
url: '{{baseUrl}}/private/passwords'
method: POST
headers:
  Content-Type: application/json
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
body:
  type: text
  content: '{"title":"Flow Test Password","username":"flowuser","password":"flow-test-secret","website":"https://flow-test.com","notes":"Created by CRUD flow","category":"Testing","tags":["flow"]}'
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();

      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Password created', function () {
          pm.expect(json.data).to.have.property('id');
          pm.expect(json.data.title).to.equal('Flow Test Password');
      });

      if (json.data && json.data.id) {
          pm.collectionVariables.set('passwordId', json.data.id);
          pm.environment.set('passwordId', json.data.id);
          console.log('Flow passwordId saved: ' + json.data.id);
      }
    language: text/javascript
order: 2000
