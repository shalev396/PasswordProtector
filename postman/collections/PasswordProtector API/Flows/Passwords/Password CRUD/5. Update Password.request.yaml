$kind: http-request
url: '{{baseUrl}}/private/passwords/{{passwordId}}'
method: PUT
headers:
  Content-Type: application/json
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
body:
  type: text
  content: '{"title":"Flow Updated Password"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Title was updated', function () {
          const json = pm.response.json();
          pm.expect(json.data.title).to.equal('Flow Updated Password');
      });
    language: text/javascript
order: 5000
