$kind: http-request
url: '{{baseUrl}}/private/passwords'
method: GET
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Passwords list contains entries', function () {
          const json = pm.response.json();
          pm.expect(json.data.passwords).to.be.an('array');
          pm.expect(json.data.passwords.length).to.be.at.least(1);
      });

      pm.test('List items exclude password field', function () {
          const json = pm.response.json();
          json.data.passwords.forEach(function(item) {
              pm.expect(item).to.not.have.property('password');
          });
      });
    language: text/javascript
order: 3000
