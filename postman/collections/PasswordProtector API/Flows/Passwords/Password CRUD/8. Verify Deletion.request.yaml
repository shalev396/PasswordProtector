$kind: http-request
url: '{{baseUrl}}/private/passwords/{{passwordId}}'
method: GET
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () {
          pm.response.to.have.status(404);
      });

      pm.test('Password no longer exists', function () {
          const json = pm.response.json();
          pm.expect(json.message).to.be.a('string');
      });
    language: text/javascript
order: 8000
