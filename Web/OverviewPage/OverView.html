<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Protector</title>
    <link rel="stylesheet" href="/Styles/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">PASSWORD PROTECTOR</div>
        <ul>
          <li><a href="/main">Home</a></li>
          <li>
            <a id="loginButton" href="/Settings" class="cta" >Login</a>
          </li>
        </ul>
      </nav>
    </header>
    <section id="Overview">
      <div class="hero">
        <img
          src="/images/hero-image.png"
          alt="Hero Background"
          class="hero-bg"
        />
        <div class="content">
          <div class="overview-container">
              <h1>Passwords Overview</h1>
              <table id="passwordsTable">
                <tr>
                  <th>ID</th>
                  <th>TokenID</th>
                  <th>Website</th>
                  <th>WebsiteLogin</th>
                  <th>ChangedCount</th>
                  <th>UsedCount</th>
                  
                </tr>
            </table>
          </div>
        </div>
      </div>
      </div>
    </section>
    <script src="/OverViewPage/OverView.js"></script>
  </body>
</html>
