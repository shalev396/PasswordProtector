<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Password Protector</title>
    <link rel="stylesheet" href="/PasswordProtector/Web/Styles/styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">PASSWORD PROTECTOR</div>
        <ul>
          <li>
            <a href="/PasswordProtector/Web/Main Page/index.html#Home">Home</a>
          </li>
          <li><a href="index.html#about-section">About</a></li>
          <li>
            <a href="/PasswordProtector/Web/SignUp/signUP.html" class="cta"
              >Login</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <section id="signup">
      <div class="signup-container">
        <h1>Sign Up</h1>
        <form id="signup-form">
          <label for="first-name">First Name:</label>
          <input type="text" id="first-name" name="first-name" required />

          <label for="last-name">Last Name:</label>
          <input type="text" id="last-name" name="last-name" required />

          <label for="phone-number">Phone Number:</label>
          <input type="tel" id="phone-number" name="phone-number" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="key">Key:</label>
          <div class="key-container">
            <input type="text" id="key" name="key" maxlength="64" required />
            <button type="button" id="generate-key" onclick="generateKey()">
              Generate
            </button>
          </div>
          <span class="note"
            >This key will be used for encrypting/decrypting your
            password.</span
          >

          <p class="note">This email and phone number will be used for 2FA.</p>

          <button type="submit" id="submit-btn">Submit</button>
        </form>

        <button id="go-back" onclick="goBack()">Go Back</button>
      </div>
    </section>

    <script src="/PasswordProtector/Web/SignUp/signup.js"></script>
  </body>
</html>
