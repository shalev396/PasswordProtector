# ================================
# PASSWORD PROTECTOR SERVERLESS CONFIGURATION
# ================================
#
# This serverless.yml configures a complete serverless password protector application with:
# - Lambda functions for API endpoints
# - S3 bucket for client files (React build)
# - CloudFront distribution for global CDN
# - Route 53 for custom domain routing
#
# DEPLOYMENT NOTES:
# 1. SSL Certificates - CREATE MANUALLY in ACM (us-east-1 region):
#    - Create certificate for dev.password-protector.shalev396.com (add ARN to CERTIFICATE_ARN_DEV)
#    - Create certificate for password-protector.shalev396.com (add ARN to CERTIFICATE_ARN_PROD)
# 2. Ensure you have a Route 53 hosted zone for shalev396.com
# 3. Deploy stages separately:
#    - DEV:  npm run deploy:dev  (creates dev.password-protector.shalev396.com)
#    - PROD: npm run deploy:prod (creates password-protector.shalev396.com)
# 4. Each stage gets its own complete infrastructure:
#    - Separate CloudFront distributions with custom domains
#    - Separate S3 buckets
#    - Separate API Gateways
#    - Separate Route 53 records
#    - Uses manually created SSL certificates
# ================================

org: shalev396
app: password-protector
service: Password-Protector-Backend

frameworkVersion: ^4.0.0

provider:
  name: aws
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  timeout: 30
  region: il-central-1
  apiGateway:
    shouldStartNameWithService: true
  logs:
    restApi: false
  environment:
    # Environment Configuration
    ENV: ${opt:stage, 'local'}

    # Database Configuration
    DATABASE_URL_LOCAL: ${env:DATABASE_URL_LOCAL}
    DATABASE_URL_DEV: ${env:DATABASE_URL_DEV}
    DATABASE_URL_PROD: ${env:DATABASE_URL_PROD}

    # JWT Configuration
    JWT_SECRET: ${env:JWT_SECRET}
    ACCESS_TOKEN_EXPIRY: ${env:ACCESS_TOKEN_EXPIRY, '15m'}
    REFRESH_TOKEN_EXPIRY: ${env:REFRESH_TOKEN_EXPIRY, '7d'}

    # S3 Bucket Configuration (Stage-specific)
    S3_BUCKET_NAME: ${self:custom.clientBucketName.${self:provider.stage}}

    # CloudFront and Domain Configuration (Stage-specific)
    DOMAIN_NAME: ${self:custom.domainName.${self:provider.stage}}
    CLIENT_BUCKET_NAME: ${self:custom.clientBucketName.${self:provider.stage}}
    HOSTED_ZONE_ID: ${env:HOSTED_ZONE_ID} # Route 53 hosted zone ID
    CERTIFICATE_ARN_DEV: ${env:CERTIFICATE_ARN_DEV} # ACM certificate ARN
    CERTIFICATE_ARN_PROD: ${env:CERTIFICATE_ARN_PROD} # ACM certificate ARN

  iam:
    role:
      statements:
        # S3 Permissions for client bucket
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:PutObjectAcl
          Resource:
            - "arn:aws:s3:::${self:custom.clientBucketName.${self:provider.stage}}/*"

        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - "arn:aws:s3:::${self:custom.clientBucketName.${self:provider.stage}}"

        # CloudFront Permissions
        - Effect: Allow
          Action:
            - cloudfront:CreateInvalidation
            - cloudfront:GetInvalidation
            - cloudfront:ListInvalidations
          Resource: "*"

# Package Configuration
package:
  individually: true
  excludeDevDependencies: true
  patterns:
    # Exclude source and development files
    - "!src/**"
    - "!dist/**"
    - "!.serverless/**"
    - "!tsconfig.json"
    - "!webpack.config.*"
    - "!*.md"
    - "!undefined/**"
    - "!*.zip"
    - "!.env*"
    - "!node_modules/**"
    - "!build/**/*.LICENSE.txt"
    - "!build/**"

    # Individual functions specify their own webpack bundles
    # Global package excludes everything by default

build:
  esbuild: false # Disable built-in ESBuild support

# Serverless Plugins
plugins:
  - serverless-offline
  - serverless-prune-plugin

# Custom Configuration
custom:
  # ================================
  # STAGE-SPECIFIC CONFIGURATION
  # ================================
  # Domain names for different stages
  domainName:
    local: ${env:DOMAIN_NAME_LOCAL}
    dev: ${env:DOMAIN_NAME_DEV} # Will have its own certificate
    prod: ${env:DOMAIN_NAME_PROD} # Will have its own certificate

  # Client bucket names for different stages
  clientBucketName:
    local: ${env:S3_BUCKET_NAME_LOCAL}
    dev: ${env:S3_BUCKET_NAME_DEV}
    prod: ${env:S3_BUCKET_NAME_PROD}

  # CloudFront aliases - enable custom domains for both stages
  aliases:
    local:
      - ${self:custom.domainName.local}
    dev:
      - ${self:custom.domainName.dev}
    prod:
      - ${self:custom.domainName.prod}

  # SSL/TLS Certificate configuration - use manually created certificates
  viewerCertificate:
    local:
      AcmCertificateArn: ${env:CERTIFICATE_ARN_LOCAL} # Optional for local development
      SslSupportMethod: sni-only
      MinimumProtocolVersion: TLSv1.2_2021
    dev:
      AcmCertificateArn: ${env:CERTIFICATE_ARN_DEV} # Manually created dev certificate
      SslSupportMethod: sni-only
      MinimumProtocolVersion: TLSv1.2_2021
    prod:
      AcmCertificateArn: ${env:CERTIFICATE_ARN_PROD} # Manually created prod certificate
      SslSupportMethod: sni-only
      MinimumProtocolVersion: TLSv1.2_2021

  # CloudFront distribution descriptions
  distributionComment:
    local: "Password Protector Local"
    dev: "Password Protector Development"
    prod: "Password Protector Production"

  # Serverless Offline Configuration
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
    noPrependStageInUrl: true
    reloadHandler: true
    disableCookieValidation: true # ← Disables strictHeader cookie validation in Hapi
    enforceSecureCookies: false # ← Ensures Hapi won't require HTTPS for cookies
    printOutput: true

  # Prune Configuration - Cleanup old versions
  prune:
    automatic: true # run after each deploy
    number: 5 # keep the 5 most recent versions
    includeLayers: true

  # Environment Variables Configuration
  dotenv:
    path: ./.env

functions:
  # Health check function
  health:
    handler: ./build/health.handler
    package:
      patterns:
        - "!build/**"
        - "build/health.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/health
          method: get

  # Auth functions
  register:
    handler: ./build/auth/register.handler
    package:
      patterns:
        - "!build/**"
        - "build/auth/register.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/auth/register
          method: post

  login:
    handler: ./build/auth/login.handler
    package:
      patterns:
        - "!build/**"
        - "build/auth/login.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/auth/login
          method: post

  refreshToken:
    handler: ./build/auth/refreshToken.handler
    package:
      patterns:
        - "!build/**"
        - "build/auth/refreshToken.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/auth/refresh
          method: post

  getProfile:
    handler: ./build/auth/getProfile.handler
    package:
      patterns:
        - "!build/**"
        - "build/auth/getProfile.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/auth/profile
          method: get

  logout:
    handler: ./build/auth/logout.handler
    package:
      patterns:
        - "!build/**"
        - "build/auth/logout.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/auth/logout
          method: post

  # Password functions
  getAllPasswords:
    handler: ./build/passwords/getAll.handler
    package:
      patterns:
        - "!build/**"
        - "build/passwords/getAll.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/passwords
          method: get

  getPasswordById:
    handler: ./build/passwords/getOne.handler
    package:
      patterns:
        - "!build/**"
        - "build/passwords/getOne.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/passwords/{id}
          method: get

  createPassword:
    handler: ./build/passwords/create.handler
    package:
      patterns:
        - "!build/**"
        - "build/passwords/create.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/passwords
          method: post

  updatePassword:
    handler: ./build/passwords/update.handler
    package:
      patterns:
        - "!build/**"
        - "build/passwords/update.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/passwords/{id}
          method: put

  deletePassword:
    handler: ./build/passwords/delete.handler
    package:
      patterns:
        - "!build/**"
        - "build/passwords/delete.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/passwords/{id}
          method: delete

# AWS Resources Configuration
resources:
  Resources:
    # ================================
    # S3 BUCKET CONFIGURATION
    # ================================

    # S3 Bucket for Client Files (React Build)
    # This bucket will store the compiled React application files
    # Stage-specific:
    ClientFilesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.clientBucketName.${self:provider.stage}}
        # Enable public read access for static website hosting
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        # Configure for static website hosting
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html # SPA routing support
        # Enable versioning for better deployment management
        VersioningConfiguration:
          Status: Enabled
        # Lifecycle configuration to manage costs
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldVersions
              Status: Enabled
              NoncurrentVersionExpirationInDays: 30
        # CORS configuration for web access
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, HEAD]
              AllowedOrigins: ["*"]
              MaxAge: 3600

    # S3 Bucket Policy for Client Files - Allow CloudFront and public read access
    ClientFilesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: ClientFilesBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: ClientFilesBucket
                      - "/*"

    # ================================
    # CLOUDFRONT DISTRIBUTION
    # ================================

    # CloudFront Distribution - CDN for global content delivery
    # Combines API Gateway and client files under one domain
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          # Description for the distribution
          Comment: ${self:custom.distributionComment.${self:provider.stage}}

          # Enable the distribution
          Enabled: true

          # Domain aliases - the custom domain names (stage-specific)
          Aliases: ${self:custom.aliases.${self:provider.stage}}

          # SSL/TLS Certificate configuration
          ViewerCertificate: ${self:custom.viewerCertificate.${self:provider.stage}}

          # Default cache behavior for /* - serves React app
          DefaultCacheBehavior:
            TargetOriginId: ClientFilesOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            # Cache policy for SPA - optimized caching for both HTML and assets
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # Managed-CORS-S3Origin

          # Additional cache behaviors for specific paths
          # PRIORITY ORDER (evaluated top to bottom):
          # 1. /api/* → API Gateway
          # 2. /* → Client files (default behavior)
          CacheBehaviors:
            # PRIORITY 1: API Gateway behavior - /api/* routes to API Gateway
            - PathPattern: "/api/*"
              TargetOriginId: ApiGatewayOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
              CachedMethods: [GET, HEAD, OPTIONS]
              Compress: true
              # No caching for API calls
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

          # Origins configuration - where CloudFront fetches content from
          Origins:
            # Origin for React app files (S3 bucket)
            - Id: ClientFilesOrigin
              DomainName:
                Fn::GetAtt:
                  - ClientFilesBucket
                  - RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""

            # Origin for API Gateway
            - Id: ApiGatewayOrigin
              DomainName:
                Fn::Sub: "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
              CustomOriginConfig:
                HTTPPort: 443
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]

          # Error pages configuration for SPA routing
          CustomErrorResponses:
            # Redirect 403/404 to index.html for client-side routing
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 300
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 300

          # Price class - use all edge locations for best performance
          PriceClass: PriceClass_All

          # HTTP version
          HttpVersion: http2

          # IPv6 support
          IPV6Enabled: true

    # ================================
    # ROUTE 53 CONFIGURATION
    # ================================

    # Route 53 Record - Points custom domain to CloudFront distribution
    # Creates A records for both dev and prod stages
    Route53Record:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: ${env:HOSTED_ZONE_ID}
        Name: ${self:custom.domainName.${self:provider.stage}}
        Type: A
        # Alias configuration - points to CloudFront distribution
        AliasTarget:
          DNSName:
            Fn::GetAtt:
              - CloudFrontDistribution
              - DomainName
          HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID (global)
          EvaluateTargetHealth: false
