# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: shalev396
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: password-protector
# "service" is the name of this project. This will also be added to your AWS resource names.

service: Password-Protector-Backend

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    PORT: ${env:PORT, '5000'}

    DB_SERVER: ${env:DB_SERVER, 'localhost'}
    DB_DATABASE: ${env:DB_DATABASE, 'your_database'}
    DB_USER: ${env:DB_USER, 'your_user'}
    DB_PASSWORD: ${env:DB_PASSWORD, 'your_password'}

    DB_ENCRYPT: ${env:DB_ENCRYPT, 'false'}
    DB_TRUST_SERVER_CERTIFICATE: ${env:DB_TRUST_SERVER_CERTIFICATE, 'true'}
    JWT_SECRET: ${env:JWT_SECRET, 'your_jwt_secret'}
    ACCESS_TOKEN_EXPIRY: ${env:ACCESS_TOKEN_EXPIRY, '15m'}
    REFRESH_TOKEN_EXPIRY: ${env:REFRESH_TOKEN_EXPIRY, '7d'}

plugins:
  - serverless-offline
  - serverless-dotenv-plugin
useDotenv: true
custom:
  serverless-offline:
    httpPort: ${env:PORT, '5000'}
  dotenv:
    path: ./.env
  # Add hooks to run npm build before packaging
  hooks:
    before:offline:start: npm run build
    before:deploy:deploy: npm run build
    package:initialize: npm run build

# Disable esbuild since we're using serverless-bundle
package:
  individually: true
  patterns:
    - "dist/**" # Include the dist directory and all its contents
functions:
  health:
    handler: ./dist/handlers/health.handler
    events:
      - http:
          path: /api/health
          method: get
          cors: true

  # Auth functions
  register:
    handler: ./dist/handlers/auth/register.handler
    events:
      - http:
          path: /api/auth/register
          method: post
          cors: true

  login:
    handler: ./dist/handlers/auth/login.handler
    events:
      - http:
          path: /api/auth/login
          method: post
          cors: true

  refreshToken:
    handler: ./dist/handlers/auth/refreshToken.handler
    events:
      - http:
          path: /api/auth/refresh
          method: post
          cors: true

  getProfile:
    handler: ./dist/handlers/auth/getProfile.handler
    events:
      - http:
          path: /api/auth/profile
          method: get
          cors: true

  logout:
    handler: ./dist/handlers/auth/logout.handler
    events:
      - http:
          path: /api/auth/logout
          method: post
          cors: true

  # Password functions
  getAllPasswords:
    handler: ./dist/handlers/passwords/getAllPasswords.handler
    events:
      - http:
          path: /api/passwords
          method: get
          cors: true

  getPasswordById:
    handler: ./dist/handlers/passwords/getPasswordById.handler
    events:
      - http:
          path: /api/passwords/{id}
          method: get
          cors: true

  createPassword:
    handler: ./dist/handlers/passwords/createPassword.handler
    events:
      - http:
          path: /api/passwords
          method: post
          cors: true

  updatePassword:
    handler: ./dist/handlers/passwords/updatePassword.handler
    events:
      - http:
          path: /api/passwords/{id}
          method: put
          cors: true

  deletePassword:
    handler: ./dist/handlers/passwords/deletePassword.handler
    events:
      - http:
          path: /api/passwords/{id}
          method: delete
          cors: true
